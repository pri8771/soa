<title>SOA — Document Operations Prototype</title>
<style>
  :root {
    --canvas: #F6F7F9;
    --surface: #FFFFFF;
    --surface-subtle: #F0F2F5;
    --surface-raised: #FFFFFF;
    --border: #D8DDE5;
    --border-strong: #B8C0CC;
    --text-primary: #172033;
    --text-secondary: #556176;
    --text-muted: #7B8799;
    --accent: #3157D5;
    --accent-hover: #2849B8;
    --accent-soft: #E9EEFF;
    --focus: #4C74FF;
    --success: #147A55;
    --success-soft: #E6F6EF;
    --warning: #9A6200;
    --warning-soft: #FFF3D5;
    --critical: #B4233A;
    --critical-soft: #FDE9ED;
    --info: #166AA3;
    --info-soft: #E6F3FC;
    --shadow-sm: 0 1px 2px rgba(23,32,51,0.06), 0 1px 1px rgba(23,32,51,0.04);
    --shadow-md: 0 4px 16px rgba(23,32,51,0.10), 0 2px 6px rgba(23,32,51,0.06);
    --shadow-lg: 0 12px 32px rgba(23,32,51,0.16), 0 4px 12px rgba(23,32,51,0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0F1420;
      --surface: #161C2C;
      --surface-subtle: #1D2436;
      --surface-raised: #1B2233;
      --border: #2A3349;
      --border-strong: #3B4664;
      --text-primary: #E7EAF1;
      --text-secondary: #AEB7C9;
      --text-muted: #7E8AA1;
      --accent: #7C95FF;
      --accent-hover: #93A9FF;
      --accent-soft: #202B4D;
      --focus: #7C95FF;
      --success: #45CB93;
      --success-soft: #12291F;
      --warning: #E8B84B;
      --warning-soft: #2E2410;
      --critical: #F0637A;
      --critical-soft: #341620;
      --info: #5EC2F0;
      --info-soft: #142633;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
      --shadow-lg: 0 12px 36px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0F1420;
    --surface: #161C2C;
    --surface-subtle: #1D2436;
    --surface-raised: #1B2233;
    --border: #2A3349;
    --border-strong: #3B4664;
    --text-primary: #E7EAF1;
    --text-secondary: #AEB7C9;
    --text-muted: #7E8AA1;
    --accent: #7C95FF;
    --accent-hover: #93A9FF;
    --accent-soft: #202B4D;
    --focus: #7C95FF;
    --success: #45CB93;
    --success-soft: #12291F;
    --warning: #E8B84B;
    --warning-soft: #2E2410;
    --critical: #F0637A;
    --critical-soft: #341620;
    --info: #5EC2F0;
    --info-soft: #142633;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
    --shadow-lg: 0 12px 36px rgba(0,0,0,0.55);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --canvas: #F6F7F9;
    --surface: #FFFFFF;
    --surface-subtle: #F0F2F5;
    --surface-raised: #FFFFFF;
    --border: #D8DDE5;
    --border-strong: #B8C0CC;
    --text-primary: #172033;
    --text-secondary: #556176;
    --text-muted: #7B8799;
    --accent: #3157D5;
    --accent-hover: #2849B8;
    --accent-soft: #E9EEFF;
    --focus: #4C74FF;
    --success: #147A55;
    --success-soft: #E6F6EF;
    --warning: #9A6200;
    --warning-soft: #FFF3D5;
    --critical: #B4233A;
    --critical-soft: #FDE9ED;
    --info: #166AA3;
    --info-soft: #E6F3FC;
    --shadow-sm: 0 1px 2px rgba(23,32,51,0.06), 0 1px 1px rgba(23,32,51,0.04);
    --shadow-md: 0 4px 16px rgba(23,32,51,0.10), 0 2px 6px rgba(23,32,51,0.06);
    --shadow-lg: 0 12px 32px rgba(23,32,51,0.16), 0 4px 12px rgba(23,32,51,0.08);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 20px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); }

  button, [role="button"], .clickable { cursor: pointer; }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .display-sm { font-size: 30px; line-height: 38px; font-weight: 650; }
  .heading-xl { font-size: 24px; line-height: 32px; font-weight: 650; }
  .heading-lg { font-size: 20px; line-height: 28px; font-weight: 650; }
  .heading-md { font-size: 16px; line-height: 24px; font-weight: 650; }
  .body-lg { font-size: 15px; line-height: 24px; font-weight: 450; }
  .body-md { font-size: 14px; line-height: 20px; font-weight: 450; }
  .body-sm { font-size: 13px; line-height: 18px; font-weight: 450; }
  .label { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.01em; }
  .caption { font-size: 11px; line-height: 16px; font-weight: 500; color: var(--text-muted); }
  .muted { color: var(--text-secondary); }
  .faint { color: var(--text-muted); }

  #root { min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent;
    font-size: 13px; font-weight: 600; white-space: nowrap;
    background: none; transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { background: var(--border-strong); color: var(--surface); cursor: not-allowed; }
  .btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text-primary); }
  .btn-secondary:hover { background: var(--surface-subtle); }
  .btn-subtle { background: transparent; color: var(--text-secondary); }
  .btn-subtle:hover { background: var(--surface-subtle); color: var(--text-primary); }
  .btn-destructive { background: transparent; border-color: var(--border-strong); color: var(--critical); }
  .btn-destructive:hover { background: var(--critical-soft); border-color: var(--critical); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  .btn-icon { width: 32px; height: 32px; padding: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); }
  .btn-icon:hover { background: var(--surface-subtle); color: var(--text-primary); }

  /* ---------- pills / badges ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
    border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1; white-space: nowrap;
  }
  .pill svg { width: 11px; height: 11px; }
  .pill-success { background: var(--success-soft); color: var(--success); }
  .pill-warning { background: var(--warning-soft); color: var(--warning); }
  .pill-critical { background: var(--critical-soft); color: var(--critical); }
  .pill-info { background: var(--info-soft); color: var(--info); }
  .pill-neutral { background: var(--surface-subtle); color: var(--text-secondary); border: 1px solid var(--border); }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }

  /* ---------- topbar ---------- */
  .topbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 16px;
    padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40;
  }
  .wordmark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .wordmark .mark { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .org-switch {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 4px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-subtle); font-size: 13px; font-weight: 600;
  }
  .org-avatar { width: 22px; height: 22px; border-radius: 5px; background: var(--info-soft); color: var(--info); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .topbar-spacer { flex: 1; }
  .search-trigger {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; width: 240px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--surface-subtle); color: var(--text-muted); font-size: 13px;
  }
  .kbd { border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; color: var(--text-muted); background: var(--surface); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

  .content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .page { max-width: 1240px; width: 100%; margin: 0 auto; padding: 28px 24px 64px; }
  .page-wide { max-width: none; padding: 0; }

  /* ---------- skills screen ---------- */
  .skills-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1080px) { .skills-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .skills-grid { grid-template-columns: 1fr; } }

  .skill-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px; transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }
  .skill-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .skill-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .skill-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .skill-icon svg { width: 18px; height: 18px; }
  .skill-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .skill-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.01em; margin-bottom: 2px; }
  .skill-stat-value { font-size: 17px; font-weight: 650; }
  .trend-up { color: var(--success); }
  .trend-down { color: var(--critical); }
  .skill-card-foot { display: flex; align-items: center; justify-content: space-between; }
  .create-skill-card {
    border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: var(--text-secondary); min-height: 176px; text-align: center;
    background: transparent; transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
  }
  .create-skill-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- skill workspace ---------- */
  .workspace-head { background: var(--surface); border-bottom: 1px solid var(--border); }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); padding: 14px 24px 0; }
  .breadcrumb a { color: var(--text-muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .workspace-title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 24px 14px; flex-wrap: wrap; }
  .workspace-title { display: flex; align-items: center; gap: 10px; }
  .tabs { display: flex; gap: 4px; padding: 0 24px; }
  .tab-btn {
    position: relative; padding: 10px 4px; margin-right: 20px; background: none; border: none; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { color: var(--text-muted); font-weight: 600; }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 24px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-secondary);
  }
  .chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip:hover { border-color: var(--border-strong); }
  .search-box { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); min-width: 220px; }
  .search-box input { border: none; outline: none; background: none; width: 100%; font-size: 13px; }
  .search-box svg { width: 14px; height: 14px; color: var(--text-muted); flex: none; }

  .table-wrap { overflow-x: auto; padding: 16px 24px 24px; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; color: var(--text-muted);
    text-transform: uppercase; padding: 0 12px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; white-space: nowrap; }
  tbody tr { transition: background 100ms ease; }
  tbody tr.row-clickable:hover { background: var(--surface-subtle); cursor: pointer; }
  .doc-ref { font-weight: 650; color: var(--text-primary); }
  .doc-sub { color: var(--text-muted); font-size: 12px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 64px 24px; color: var(--text-secondary); }
  .empty-state .icon-wrap { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-subtle); display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 6px; }

  /* ---------- metric tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 24px 4px; }
  @media (max-width: 1000px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color 120ms ease; }
  .tile:hover { border-color: var(--border-strong); }
  .tile-value { font-size: 22px; font-weight: 650; margin: 4px 0 2px; }
  .tile-trend { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 16px 24px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .panel-body { padding: 18px; }

  .bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 100%; max-width: 34px; border-radius: 4px 4px 0 0; background: var(--accent-soft); position: relative; }
  .bar.emph { background: var(--accent); }

  .sender-perf-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .sender-perf-row:last-child { border-bottom: none; }
  .meter { height: 6px; border-radius: 999px; background: var(--surface-subtle); overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 999px; }

  /* ---------- senders tab ---------- */
  .sender-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin: 0 24px 14px; overflow: hidden; }
  .sender-card:first-child { margin-top: 18px; }
  .sender-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; cursor: pointer; }
  .sender-head:hover { background: var(--surface-subtle); }
  .sender-id { display: flex; align-items: center; gap: 10px; }
  .sender-avatar { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-subtle); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--text-secondary); }
  .sender-anchors { border-top: 1px solid var(--border); }
  .anchor-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px dashed var(--border); }
  .anchor-row:last-child { border-bottom: none; }
  .anchor-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .compare-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-subtle); }
  .compare-box.after { background: var(--success-soft); border-color: var(--success); }
  .compare-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 4px; }

  /* ---------- upload modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15,20,32,0.44); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); }
  .field-row label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field-row input[type="text"], .field-row select {
    width: 100%; height: 38px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
    padding: 0 10px; font-size: 13px; color: var(--text-primary);
  }
  .field-row input:focus, .field-row select:focus { border-color: var(--accent); }
  .dropzone {
    border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 28px; text-align: center; color: var(--text-secondary);
  }
  .step-dots { display: flex; gap: 6px; }
  .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
  .step-dot.active { background: var(--accent); width: 16px; border-radius: 4px; }

  /* ---------- review studio ---------- */
  .studio { display: flex; flex-direction: column; height: calc(100vh - 56px); }
  .studio-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 56px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .studio-head-meta { display: flex; flex-direction: column; gap: 1px; }
  .studio-body { flex: 1; display: grid; grid-template-columns: 84px 1fr 440px; min-height: 0; }
  @media (max-width: 1280px) { .studio-body { grid-template-columns: 72px 1fr 400px; } }

  .thumb-rail { background: var(--surface-subtle); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .thumb { width: 56px; height: 72px; background: var(--surface); border: 2px solid var(--border); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); font-weight: 700; }
  .thumb.active { border-color: var(--accent); color: var(--accent); }

  .doc-viewer { position: relative; overflow: auto; background: var(--surface-subtle); padding: 24px; display: flex; justify-content: center; }
  .doc-toolbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: center; margin-bottom: 12px; }
  .doc-toolbar-inner { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: var(--shadow-sm); }

  .paper {
    position: relative; width: 680px; min-height: 880px; background: #FDFDFC; color: #1a1a1a; border-radius: 3px;
    box-shadow: var(--shadow-md); flex: none; font-family: Georgia, "Times New Roman", serif;
  }
  .paper * { box-sizing: border-box; }
  .paper-region {
    position: absolute; border-radius: 3px; border: 1.5px solid transparent; cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .paper-region:hover { background: rgba(76,116,255,0.08); }

        '<td style="padding:4px 6px">' + li.desc + '</td><td style="padding:4px 6px;text-align:right">' + li.qty + '</td>' +
        '<td style="padding:4px 6px">' + li.uom + '</td><td style="padding:4px 6px;text-align:right">' + priceStr + '</td>' +
        '<td style="padding:4px 6px;text-align:right">' + totalStr + '</td></tr>';
    }).join("");
    return '<div style="position:absolute;top:322px;left:22px;width:636px;font-size:10.5px">' +
      '<table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:1.5px solid #333;font-weight:700">' +
      '<td style="padding:4px 6px">Line</td><td style="padding:4px 6px">Item</td><td style="padding:4px 6px">Description</td><td style="padding:4px 6px;text-align:right">Qty</td><td style="padding:4px 6px">UOM</td><td style="padding:4px 6px;text-align:right">Unit price</td><td style="padding:4px 6px;text-align:right">Total</td>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderFieldPanel() {
    var panel = el('<div style="display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--border);background:var(--surface)"></div>');
    var nav = el('<div class="reason-nav"></div>');
    var navHead = el('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"></div>');
    navHead.innerHTML = '<span class="label muted">Review reasons</span>' +
      '<button class="link-btn" style="font-size:11px" data-action="toggle-all-fields">' + (S.showAllFields ? "Show flagged only" : "Show all fields") + '</button>';
    nav.appendChild(navHead);
    REASONS.forEach(function (r) {
      var resolved = S.resolved[r.id];
      var item = el('<div class="reason-item ' + (S.activeReason === r.id ? "active" : "") + '" data-action="select-reason" data-field="' + r.id + '"></div>');
      item.innerHTML =
        '<span class="reason-dot ' + (resolved ? "resolved" : r.level) + '"></span>' +
        '<div><div class="body-sm" style="font-weight:600">' + r.title + (resolved ? ' <span class="caption" style="color:var(--success)">· resolved</span>' : '') + '</div>' +
        '<div class="caption">' + r.desc + '</div></div>';
      nav.appendChild(item);
    });
    panel.appendChild(nav);

    var scroll = el('<div class="field-panel-scroll"></div>');
    var visibleFields = S.showAllFields ? FIELDS : FIELDS.filter(function (f) { return REASONS.some(function (r) { return r.id === f.id; }); });
    visibleFields.forEach(function (f) { scroll.appendChild(renderFieldCard(f)); });
    scroll.appendChild(renderLineItemGridPanel());
    panel.appendChild(scroll);

    panel.appendChild(renderApprovalBar());
    return panel;
  }

  function renderFieldCard(f) {
    var resolved = S.resolved[f.id];
    var flaggedClass = (!resolved && f.status !== "ok") ? "flagged " + f.status : "";
    var card = el('<div class="field-card ' + flaggedClass + '" data-field-card="' + f.id + '"></div>');
    var val = S.fieldValues[f.id] !== undefined ? S.fieldValues[f.id] : f.value;
    var confHtml = f.status === "critical" ? '<span class="pill pill-critical">' + f.confidence + '% confidence</span>' :
      f.status === "warning" ? '<span class="pill pill-warning">' + (f.confidence || "low") + (typeof f.confidence === "number" ? "% confidence" : "") + '</span>' :
      '<span class="pill pill-success">' + f.confidence + '% confidence</span>';
    card.innerHTML =
      '<div class="field-card-top"><div class="field-label-row"><span class="body-sm" style="font-weight:650">' + f.label + '</span>' + (f.critical ? '<span class="pill pill-accent">Critical</span>' : '') + '</div>' + confHtml + '</div>' +
      '<input class="field-input" data-field-input="' + f.id + '" value="' + escapeAttr(val) + '" placeholder="Not detected — enter a value"/>' +
      (f.raw && f.raw !== val && f.raw !== "same" ? '<div class="caption" style="margin-top:5px">Raw: ' + f.raw + '</div>' : '') +
      '<div class="field-meta-row"><button class="evidence-link" data-evidence-trigger data-action="toggle-evidence" data-field="' + f.id + '">' + icon("evidence") + 'View evidence</button>' +
      (f.id === "shipTo" ? '<button class="evidence-link" data-action="open-candidates">' + icon("link") + 'Match candidates</button>' : '') +
      '</div>';
    if (S.evidencePopoverFor === f.id) card.appendChild(renderEvidencePopover(f));
    if (S.candidatePopoverOpen && f.id === "shipTo") card.appendChild(renderCandidatePopover());
    if (S.teachPromptFor === f.id && !S.teachSaved[f.id]) {
      card.appendChild(el(
        '<div class="teach-banner"><span>Save this position as a template hint for future <strong>' + REVIEW_DOC.sender + '</strong> documents?</span>' +
        '<div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" data-action="teach-yes" data-field="' + f.id + '">Yes, propose it</button>' +
        '<button class="btn btn-subtle btn-sm" data-action="teach-no" data-field="' + f.id + '">Not now</button></div></div>'
      ));
    }
    if (S.teachSaved[f.id]) {
      card.appendChild(el('<div class="caption" style="margin-top:8px;color:var(--accent)">' + icon("check") + ' Proposed as a template hint — awaiting supervisor publish in Senders & templates.</div>'));
    }
    return card;
  }
  function escapeAttr(s) { return String(s == null ? "" : s).replace(/"/g, "&quot;"); }

  function renderEvidencePopover(f) {
    var pop = el('<div class="popover" style="right:10px;top:90px"></div>');
    var rows = [
      ["Source", "Page 1, header block"],
      ["Method", f.id === "poDate" ? "OCR (Tesseract) — low text confidence" : "Native PDF text"],
      ["Provider / model", "Local extraction v2.3"],
      ["Schema version", "v7 · published Jun 28"],
      ["Coordinate certainty", f.id === "poDate" ? "Page-level only — stamp overlaps field" : "Precise bounding box"],
      ["Validation", f.status === "ok" ? "Passed" : f.status === "critical" ? "Below confidence threshold" : "Unresolved"]
    ];
    pop.innerHTML = '<div class="body-sm" style="font-weight:650;margin-bottom:6px">Evidence — ' + f.label + '</div>' +
      rows.map(function (r) { return '<div class="popover-row"><span class="muted">' + r[0] + '</span><span style="text-align:right;font-weight:600">' + r[1] + '</span></div>'; }).join("") +
      (f.id === "poNumber" ? '<div class="caption" style="margin-top:8px;color:var(--accent)">' + icon("sparkle") + ' Matched sender template “Acme Industrial Supply Ltd”, published 3 weeks ago</div>' : '');
    return pop;
  }
  function renderCandidatePopover() {
    var pop = el('<div class="popover" style="right:10px;top:150px;width:340px"></div>');
    var html = '<div class="body-sm" style="font-weight:650;margin-bottom:8px">Ship-to candidates</div><div class="candidate-list">';
    SHIP_TO_CANDIDATES.forEach(function (c, i) {
      var selected = S.fieldValues.shipTo === c.name;
      html += '<div class="candidate-item ' + (selected ? "selected" : "") + '" data-action="select-candidate" data-idx="' + i + '">' +
        '<div style="flex:1"><div class="body-sm" style="font-weight:600">' + c.name + '</div>' +
        c.breakdown.map(function (b) { return '<div class="score-bar-row"><span style="width:88px" class="caption">' + b[0] + '</span><div class="meter"><div class="meter-fill" style="width:' + Math.round((b[2] / b[1]) * 100) + '%"></div></div><span class="caption num">' + b[2] + '/' + b[1] + '</span></div>'; }).join("") +
        '</div><span class="pill ' + (c.score >= 80 ? "pill-success" : "pill-warning") + '" style="margin-left:8px">' + c.score + '</span></div>';
    });
    html += '</div>';
    pop.innerHTML = html;
    return pop;
  }

  function renderLineItemGridPanel() {
    var wrap = el('<div class="grid-panel"></div>');
    var head = el('<div class="grid-panel-head"><span class="body-sm" style="font-weight:650">Line items</span><span class="caption">4 rows · 1 flagged</span></div>');
    wrap.appendChild(head);
    var tw = el('<div class="scroll-x" style="padding:0 4px 10px"></div>');
    var rows = LINE_ITEMS.map(function (li) {
      var priceCell;
      if (li.flag) {
        var chosen = S.lineItemEdits[li.line];
        priceCell = '<select data-action="pick-price" data-line="' + li.line + '"><option value="">Select…</option>' +
          li.candidates.map(function (c) { return '<option value="' + c + '" ' + (chosen == c ? "selected" : "") + '>' + fmtGBP(c) + '</option>'; }).join("") + '</select>';
      } else {
        priceCell = '<span class="num">' + fmtGBP(li.price) + '</span>';
      }
      var totalDisplay = li.flag ? (S.lineItemEdits[li.line] ? '<span class="num">' + fmtGBP(li.qty * S.lineItemEdits[li.line]) + '</span>' : '<span class="faint">—</span>') : '<span class="num">' + fmtGBP(li.total) + '</span>';
      return '<tr class="' + (li.flag ? "flag" : "") + '"><td class="num">' + li.line + '</td><td>' + li.item + '</td><td class="num">' + li.qty + ' ' + li.uom + '</td><td>' + priceCell + '</td><td>' + totalDisplay + '</td></tr>';
    }).join("");
    tw.appendChild(el('<table class="li-table"><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>' + rows + '</tbody></table>'));
    wrap.appendChild(tw);
    wrap.appendChild(el('<div style="padding:8px 12px;border-top:1px solid var(--border);display:flex;justify-content:space-between" class="body-sm"><span class="muted">Totals reconcile</span><span style="color:var(--success);font-weight:650">' + icon("check") + ' Passed</span></div>'));
    return wrap;
  }

  function renderApprovalBar() {
    var bar = el('<div class="approval-bar"></div>');
    var resolvedCount = REASONS.filter(function (r) { return S.resolved[r.id]; }).length;
    var overrides = Object.keys(S.teachSaved).length;
    bar.innerHTML =
      '<ul class="approval-summary-list">' +
        '<li>' + icon(resolvedCount === REASONS.length ? "checkCircle" : "alertTriangle", resolvedCount === REASONS.length ? "" : "") + resolvedCount + ' of ' + REASONS.length + ' review reasons resolved</li>' +
        '<li>' + icon("check") + overrides + ' field override' + (overrides === 1 ? "" : "s") + ' made this session</li>' +
        '<li>' + icon("link") + 'Export destination: Signed webhook — ERP (Production)</li>' +
      '</ul>' +
      (resolvedCount < REASONS.length ?
        '<div class="caption" style="color:var(--warning);margin-bottom:8px">' + icon("alertTriangle") + ' Resolve all review reasons before approving.</div>' : '') +
      '<button class="btn btn-primary" style="width:100%" data-action="approve-doc" ' + (resolvedCount === REASONS.length ? "" : "disabled") + '>' + icon("check") + 'Approve order</button>';
    return bar;
  }

  function renderKbdLegend() {
    var pop = el('<div class="popover kbd-legend" style="width:280px"></div>');
    var rows = [["J / K", "Next / previous reason"], ["Tab", "Next field"], ["Enter", "Edit / commit field"], ["E", "Focus evidence"], ["M", "Match candidates"], ["A", "Approval summary"], ["R", "Reject / escalate"], ["[ / ]", "Previous / next page"], ["+ / -", "Zoom document"], ["?", "Toggle this guide"]];
    pop.innerHTML = '<div class="body-sm" style="font-weight:650;margin-bottom:6px">Keyboard shortcuts</div><div class="kbd-legend-grid">' +
      rows.map(function (r) { return '<span class="kbd">' + r[0] + '</span><span class="caption">' + r[1] + '</span>'; }).join("") + '</div>';
    return pop;
  }

  /* ============================= ACTIONS ============================= */
  function bindActions(root) {
    root.querySelectorAll("[data-action]").forEach(function (node) {
      if (node.dataset.bound) return;
      node.dataset.bound = "1";
      node.addEventListener("click", function (e) {
        var action = node.getAttribute("data-action");
        handleAction(action, node, e);
      });
    });
    root.querySelectorAll("#doc-search").forEach(function (n) {
      n.addEventListener("input", function () { S.docSearch = n.value; renderKeepScroll(); });
    });
    root.querySelectorAll("[data-field-input]").forEach(function (n) {
      n.addEventListener("change", function () {
        var fid = n.getAttribute("data-field-input");
        S.fieldValues[fid] = n.value;
        S.resolved[fid] = true;
        S.saveState = "saving";
        S.teachPromptFor = fid;
        renderKeepScroll();
        setTimeout(function () { S.saveState = "saved"; var lbl = document.getElementById("save-state-label"); if (lbl) lbl.textContent = "Saved"; }, 650);
      });
    });
    root.querySelectorAll("select[data-action='pick-price']").forEach(function (n) {
      if (n.dataset.bound2) return; n.dataset.bound2 = "1";
      n.addEventListener("change", function () {
        var line = n.getAttribute("data-line");
        S.lineItemEdits[line] = parseFloat(n.value);
        toast("Line " + line + " unit price updated", "check");
        render();
      });
    });
  }

  function renderKeepScroll() { render(); }

  function handleAction(action, node, e) {
    e.stopPropagation();
    switch (action) {
      case "noop": break;
      case "toggle-theme": S.theme = currentIsDark() ? "light" : "dark"; applyTheme(); render(); break;
      case "go-skills": S.screen = "skills"; render(); break;
      case "go-manage": S.screen = "manage"; render(); break;
      case "open-skill": S.currentSkillId = node.getAttribute("data-id"); S.screen = "skillWorkspace"; S.tab = "documents"; S.docFilter = "all"; render(); break;
      case "set-tab": S.tab = node.getAttribute("data-tab"); render(); break;
      case "set-manage-tab": S.manageTab = node.getAttribute("data-tab"); render(); break;
      case "set-doc-filter": S.docFilter = node.getAttribute("data-filter"); render(); break;
      case "clear-doc-filters": S.docFilter = "all"; S.docSearch = ""; render(); break;
      case "open-upload": S.uploadOpen = true; S.uploadStep = 1; render(); break;
      case "close-upload": case "close-upload-bg": S.uploadOpen = false; render(); break;
      case "upload-next": S.uploadStep = Math.min(3, S.uploadStep + 1); render(); break;
      case "upload-back": S.uploadStep = Math.max(1, S.uploadStep - 1); render(); break;
      case "open-create-skill": S.createSkillOpen = true; S.createStep = 1; render(); break;
      case "close-create": case "close-create-bg": S.createSkillOpen = false; render(); break;
      case "create-next": S.createStep = Math.min(3, S.createStep + 1); render(); break;
      case "create-back": S.createStep = Math.max(1, S.createStep - 1); render(); break;
      case "create-finish":
        DATA.skills.push({ id: "sk_fr_" + Date.now(), name: "PO Extraction — France", docType: "Purchase order", status: "draft", docs30d: 0, backlog: 0, strRate: null, strTrend: 0, lastActivity: "Never run", hasTraining: false });
        DATA.documents["sk_fr_" + Object.keys(DATA.documents).length] = [];
        S.createSkillOpen = false; S.screen = "skills"; render(); toast("Skill created in draft", "check");
        break;
      case "toggle-sender": var sid = node.getAttribute("data-sender"); S.openSenders[sid] = !S.openSenders[sid]; render(); break;
      case "publish-template": {
        var key = node.getAttribute("data-skill") + "|" + node.getAttribute("data-sender") + "|" + node.getAttribute("data-field");
        S.senderTemplateStatus[key] = "published";
        render(); toast("Template hint published — future documents from this sender will use it", "checkCircle");
        break;
      }
      case "reject-template": {
        var key2 = node.getAttribute("data-skill") + "|" + node.getAttribute("data-sender") + "|" + node.getAttribute("data-field");
        S.senderTemplateStatus[key2] = "rejected";
        render(); toast("Proposal rejected — no change made", "x");
        break;
      }
      case "run-eval": toast("Evaluation started — this can take a few minutes in production", "sparkle"); break;
      case "retry-delivery": toast("Delivery replay queued", "reopen"); break;
      case "open-review": S.screen = "review"; S.activeReason = "poDate"; render(); break;
      case "close-review": S.screen = "skillWorkspace"; render(); break;
      case "select-reason": case "select-region":
        S.activeReason = node.getAttribute("data-field");
        S.evidencePopoverFor = null; S.candidatePopoverOpen = false;
        render();
        setTimeout(function () {
          var card = document.querySelector('[data-field-card="' + S.activeReason + '"]');
          if (card) card.scrollIntoView({ block: "nearest", behavior: currentIsDark() === null ? "auto" : "smooth" });
        }, 0);
        break;
      case "toggle-all-fields": S.showAllFields = !S.showAllFields; render(); break;
      case "toggle-evidence": {
        var fid2 = node.getAttribute("data-field");
        S.evidencePopoverFor = S.evidencePopoverFor === fid2 ? null : fid2;
        S.candidatePopoverOpen = false;
        render();
        break;
      }
      case "open-candidates": S.candidatePopoverOpen = !S.candidatePopoverOpen; S.evidencePopoverFor = null; render(); break;
      case "select-candidate": {
        var idx = parseInt(node.getAttribute("data-idx"), 10);
        S.fieldValues.shipTo = SHIP_TO_CANDIDATES[idx].name;
        S.resolved.shipTo = true;
        S.candidatePopoverOpen = false;
        S.teachPromptFor = "shipTo";
        render();
        break;
      }
      case "teach-yes": {
        var tf = node.getAttribute("data-field");
        S.teachSaved[tf] = true;
        S.teachPromptFor = null;
        render();
        toast("Proposed as a template hint for " + REVIEW_DOC.sender, "sparkle");
        break;
      }
      case "teach-no": S.teachPromptFor = null; render(); break;
      case "toggle-kbd": S.kbdLegendOpen = !S.kbdLegendOpen; render(); break;
      case "zoom-in": S.zoom = Math.min(1.4, S.zoom + 0.1); render(); break;
      case "zoom-out": S.zoom = Math.max(0.6, S.zoom - 0.1); render(); break;
      case "approve-doc":
        if (node.hasAttribute("disabled")) break;
        S.docStatus.d1 = "approved";
        S.screen = "skillWorkspace";
        render();
        toast("PO-4471209 approved and queued for export", "checkCircle");
        break;
      case "signin": S.screen = "skills"; render(); break;
      case "cycle-signin-error":
        S.signinErrorIdx = ((S.signinErrorIdx || 0) + 1) % SIGNIN_ERRORS.length;
        render();
        break;
      default: break;
    }
  }

  function applyTheme() {
    if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
    else document.documentElement.removeAttribute("data-theme");
  }

  document.addEventListener("keydown", function (e) {
    if (S.screen !== "review") return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.key === "j" || e.key === "k") {
      var ids = REASONS.map(function (r) { return r.id; });
      var idx = ids.indexOf(S.activeReason);
      idx = e.key === "j" ? Math.min(ids.length - 1, idx + 1) : Math.max(0, idx - 1);
      S.activeReason = ids[idx]; render();
    } else if (e.key === "?") { S.kbdLegendOpen = !S.kbdLegendOpen; render(); }
    else if (e.key === "Escape") { S.evidencePopoverFor = null; S.candidatePopoverOpen = false; S.kbdLegendOpen = false; render(); }
  });

  applyTheme();
  render();
})();
</script>
