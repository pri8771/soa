# Local development services. Started via `make local-up` (uses --wait so the
# command returns only when every started service is healthy).
#
# Credentials here are development-only and deliberately recognizable as such.
# Production configuration validation (FND-007) refuses to start any service
# configured with these values outside development.
#
# Profiles:
#   default    postgres + minio + mailpit
#   scanner    adds ClamAV (slow first start: virus-definition download)
#   telemetry  adds an all-in-one local OTLP collector + Grafana UI

name: soa-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soa_dev
      POSTGRES_PASSWORD: soa_dev_password
      POSTGRES_DB: soa
    ports:
      - "${SOA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soa_dev -d soa"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soa_dev
      MINIO_ROOT_PASSWORD: soa_dev_password
    ports:
      - "${SOA_MINIO_PORT:-9000}:9000"
      - "${SOA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SOA_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${SOA_MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    profiles: ["scanner"]
    ports:
      - "${SOA_CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  telemetry:
    image: grafana/otel-lgtm:latest
    profiles: ["telemetry"]
    ports:
      - "${SOA_OTLP_GRPC_PORT:-4317}:4317"
      - "${SOA_OTLP_HTTP_PORT:-4318}:4318"
      - "${SOA_GRAFANA_PORT:-3000}:3000"
    volumes:
      - telemetry-data:/data

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  clamav-data:
  telemetry-data:
