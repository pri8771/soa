[project]
name = "soa-workspace"
version = "0.0.0"
description = "SOA monorepo workspace root (not an installable package)"
requires-python = ">=3.11"
dependencies = ["soa-api", "soa-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv.sources]
soa-api = { workspace = true }
soa-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/src", "apps/worker/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["apps/api/src", "apps/worker/src"]
mypy_path = ["apps/api/src", "apps/worker/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
