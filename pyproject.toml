[project]
name = "soa-workspace"
version = "0.0.0"
description = "SOA monorepo workspace root (not an installable package)"
requires-python = ">=3.11"
dependencies = ["soa-api", "soa-worker", "soa-config", "soa-fixtures", "soa-db", "soa-storage", "soa-normalize", "soa-rules"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/config", "packages/test-fixtures", "packages/db", "packages/storage", "packages/normalize", "packages/rules"]

[tool.uv.sources]
soa-api = { workspace = true }
soa-worker = { workspace = true }
soa-config = { workspace = true }
soa-fixtures = { workspace = true }
soa-db = { workspace = true }
soa-storage = { workspace = true }
soa-normalize = { workspace = true }
soa-rules = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "moto[server]>=5",
    "hypothesis>=6.115",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/src", "apps/worker/src", "packages/config/src", "packages/test-fixtures/src", "packages/db/src", "packages/storage/src", "packages/normalize/src", "packages/rules/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["apps/api/src", "apps/worker/src", "packages/config/src", "packages/test-fixtures/src", "packages/db/src", "packages/storage/src", "packages/normalize/src", "packages/rules/src"]
mypy_path = ["apps/api/src", "apps/worker/src", "packages/config/src", "packages/test-fixtures/src", "packages/db/src", "packages/storage/src", "packages/normalize/src", "packages/rules/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["aiobotocore.*", "botocore.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/config/tests", "packages/test-fixtures/tests", "packages/db/tests", "packages/storage/tests", "packages/normalize/tests", "packages/rules/tests", "tests"]
markers = [
    "postgres: requires a real PostgreSQL database (SOA_TEST_POSTGRES_URL)",
    "minio: requires a live MinIO/S3 endpoint (SOA_TEST_MINIO_URL)",
]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
