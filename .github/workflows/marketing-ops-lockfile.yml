name: Generate Marketing Ops lockfile

on:
  push:
    branches:
      - agent/marketing-ops-fnd-001

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marketing-ops-fnd-001
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: products/marketing-ops/pnpm-lock.yaml
      - name: Generate deterministic lockfile
        working-directory: products/marketing-ops
        run: pnpm install --lockfile-only
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/marketing-ops-lockfile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add products/marketing-ops/pnpm-lock.yaml .github/workflows/marketing-ops-lockfile.yml
          git commit -m 'chore(marketing-ops): add deterministic pnpm lockfile [skip ci]'
          git push origin HEAD:agent/marketing-ops-fnd-001
