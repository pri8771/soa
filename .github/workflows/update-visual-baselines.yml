# Playwright screenshots depend on the renderer's font stack, so baselines
# generated on a developer machine drift by a few pixels from the CI runner.
# CI rendering is canonical: this workflow regenerates every baseline on the
# same runner image the `visual-and-a11y` job uses and commits the result
# back to the branch it was dispatched from. Trigger it manually after any
# intentional UI change, then review the image diff like any code change.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate Playwright baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @soa/web exec playwright install chromium --with-deps
      - name: Build web app
        run: pnpm --filter @soa/web run build
      - name: Regenerate baselines
        run: pnpm --filter @soa/web exec playwright test --update-snapshots
      - name: Commit and push updated baselines
        run: |
          if [ -z "$(git status --porcelain -- apps/web/e2e/__screenshots__)" ]; then
            echo "Baselines already match CI rendering; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/__screenshots__
          git commit -m "Adopt CI-rendered Playwright baselines"
          git push origin "HEAD:${{ github.ref_name }}"
