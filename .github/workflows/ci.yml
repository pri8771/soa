name: CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install OCR engine (AIO-004 adapter tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu fonts-dejavu-core
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: TypeScript
        run: pnpm run typecheck
      - name: Vitest
        run: pnpm run test
      - name: Production build
        run: pnpm run build

  local-services:
    name: Local services health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose -f infrastructure/local/docker-compose.yml up -d --wait
      - name: Check service health
        run: ./infrastructure/local/check-services.sh
      - name: Data survives restart
        run: |
          docker compose -f infrastructure/local/docker-compose.yml exec -T postgres \
            psql -U soa_dev -d soa -c "CREATE TABLE ci_persistence_probe (id int);"
          docker compose -f infrastructure/local/docker-compose.yml restart postgres
          docker compose -f infrastructure/local/docker-compose.yml up -d --wait
          docker compose -f infrastructure/local/docker-compose.yml exec -T postgres \
            psql -U soa_dev -d soa -c "SELECT * FROM ci_persistence_probe;"
      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yml down

  visual-and-a11y:
    name: Visual regression and accessibility (Playwright)
    runs-on: ubuntu-latest
    # Skipped when the push is itself a baseline-update request (see the
    # update-visual-baselines job below) — the new baselines land in a
    # follow-up commit and are validated on the next run.
    if: ${{ !contains(github.event.head_commit.message, '[update-baselines]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @soa/web exec playwright install chromium --with-deps
      - name: Build web app
        run: pnpm --filter @soa/web run build
      - name: Run visual + accessibility suite
        run: pnpm --filter @soa/web run test:visual
      - name: Upload actual screenshots and diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # Playwright screenshots depend on the renderer's font stack, so baselines
  # generated on a developer machine drift by a few pixels from the CI
  # runner. CI rendering is canonical: pushing a commit whose message
  # contains "[update-baselines]" regenerates every baseline on the same
  # runner image the visual job uses and commits the result back to the
  # branch. Review the image diff like any code change.
  update-visual-baselines:
    name: Regenerate Playwright baselines
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[update-baselines]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @soa/web exec playwright install chromium --with-deps
      - name: Build web app
        run: pnpm --filter @soa/web run build
      - name: Regenerate baselines
        run: pnpm --filter @soa/web exec playwright test --update-snapshots
      - name: Commit and push updated baselines
        run: |
          if [ -z "$(git status --porcelain -- apps/web/e2e/__screenshots__)" ]; then
            echo "Baselines already match CI rendering; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/__screenshots__
          git commit -m "Adopt CI-rendered Playwright baselines"
          git push origin "HEAD:${{ github.ref_name }}"

  migrations:
    name: Migration upgrade/downgrade check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soa_dev
          POSTGRES_PASSWORD: soa_dev_password
          POSTGRES_DB: soa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soa_dev -d soa"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SOA_DATABASE_URL: postgresql+psycopg://soa_dev:soa_dev_password@localhost:5432/soa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Downgrade to base
        run: uv run alembic downgrade base
      - name: Re-upgrade to head
        run: uv run alembic upgrade head
      # The bootstrap user created by the postgres image is a SUPERUSER and
      # superusers bypass row-level security entirely — RLS tests must run
      # as a plain application role, exactly like production.
      - name: Create non-superuser application role
        run: |
          psql "postgresql://soa_dev:soa_dev_password@localhost:5432/soa" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE soa_app LOGIN PASSWORD 'soa_app_password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO soa_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO soa_app;
          SQL
      - name: PostgreSQL-only tests (RLS isolation, SKIP LOCKED claiming)
        env:
          SOA_TEST_POSTGRES_URL: postgresql+asyncpg://soa_app:soa_app_password@localhost:5432/soa
        run: uv run pytest -m postgres -v

  storage:
    name: Object storage contract (MinIO)
    runs-on: ubuntu-latest
    env:
      SOA_TEST_MINIO_URL: http://127.0.0.1:9000
      SOA_TEST_MINIO_ACCESS_KEY: soa_dev
      SOA_TEST_MINIO_SECRET_KEY: soa_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      # docker run (not a service container) because the minio image needs
      # a command argument, which GitHub service containers cannot pass.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=soa_dev -e MINIO_ROOT_PASSWORD=soa_dev_password \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1
      - name: S3 adapter contract tests against real MinIO
        run: uv run pytest -m minio -v

  docs:
    name: Documentation links and commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs
        run: python3 scripts/check_docs.py

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python dependency audit
        run: |
          uv export --format requirements-txt --no-emit-project --no-emit-workspace > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
