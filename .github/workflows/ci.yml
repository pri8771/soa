name: CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install OCR engine (AIO-004 adapter tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu fonts-dejavu-core
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: TypeScript
        run: pnpm run typecheck
      - name: Vitest
        run: pnpm run test
      - name: Production build
        run: pnpm run build

  local-services:
    name: Local services health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Start services
        run: docker compose -f infrastructure/local/docker-compose.yml up -d --wait
      - name: Check service health
        run: ./infrastructure/local/check-services.sh
      - name: Data survives restart
        run: |
          docker compose -f infrastructure/local/docker-compose.yml exec -T postgres \
            psql -U soa_dev -d soa -c "CREATE TABLE ci_persistence_probe (id int);"
          docker compose -f infrastructure/local/docker-compose.yml restart postgres
          docker compose -f infrastructure/local/docker-compose.yml up -d --wait
          docker compose -f infrastructure/local/docker-compose.yml exec -T postgres \
            psql -U soa_dev -d soa -c "SELECT * FROM ci_persistence_probe;"
      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yml down

  visual-and-a11y:
    name: Visual regression and accessibility (Playwright)
    runs-on: ubuntu-latest
    # Skipped when the push is itself a baseline-update request (see the
    # update-visual-baselines job below) — the new baselines land in a
    # follow-up commit and are validated on the next run.
    if: ${{ !contains(github.event.head_commit.message, '[update-baselines]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @soa/web exec playwright install chromium --with-deps
      - name: Build web app
        run: pnpm --filter @soa/web run build
      - name: Run visual + accessibility suite
        run: pnpm --filter @soa/web run test:visual
      - name: Upload actual screenshots and diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # Playwright screenshots depend on the renderer's font stack, so baselines
  # generated on a developer machine drift by a few pixels from the CI
  # runner. CI rendering is canonical: pushing a commit whose message
  # contains "[update-baselines]" regenerates every baseline on the same
  # runner image the visual job uses and commits the result back to the
  # branch. Review the image diff like any code change.
  update-visual-baselines:
    name: Regenerate Playwright baselines
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[update-baselines]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @soa/web exec playwright install chromium --with-deps
      - name: Build web app
        run: pnpm --filter @soa/web run build
      - name: Regenerate baselines
        run: pnpm --filter @soa/web exec playwright test --update-snapshots
      - name: Commit and push updated baselines
        run: |
          if [ -z "$(git status --porcelain -- apps/web/e2e/__screenshots__)" ]; then
            echo "Baselines already match CI rendering; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/__screenshots__
          git commit -m "Adopt CI-rendered Playwright baselines"
          git push origin "HEAD:${{ github.ref_name }}"

  migrations:
    name: Migration upgrade/downgrade check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soa_dev
          POSTGRES_PASSWORD: soa_dev_password
          POSTGRES_DB: soa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soa_dev -d soa"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SOA_DATABASE_URL: postgresql+psycopg://soa_dev:soa_dev_password@localhost:5432/soa
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Downgrade to base
        run: uv run alembic downgrade base
      - name: Re-upgrade to head
        run: uv run alembic upgrade head
      # The bootstrap user created by the postgres image is a SUPERUSER and
      # superusers bypass row-level security entirely — RLS tests must run
      # as a plain application role, exactly like production.
      - name: Create non-superuser application role
        run: |
          psql "postgresql://soa_dev:soa_dev_password@localhost:5432/soa" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE soa_app LOGIN PASSWORD 'soa_app_password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO soa_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO soa_app;
          SQL
      - name: PostgreSQL-only tests (RLS isolation, SKIP LOCKED claiming)
        env:
          SOA_TEST_POSTGRES_URL: postgresql+asyncpg://soa_app:soa_app_password@localhost:5432/soa
        run: uv run pytest -m postgres -v

  storage:
    name: Object storage contract (MinIO)
    runs-on: ubuntu-latest
    env:
      SOA_TEST_MINIO_URL: http://127.0.0.1:9000
      SOA_TEST_MINIO_ACCESS_KEY: soa_dev
      SOA_TEST_MINIO_SECRET_KEY: soa_dev_password
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      # docker run (not a service container) because the minio image needs
      # a command argument, which GitHub service containers cannot pass.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=soa_dev -e MINIO_ROOT_PASSWORD=soa_dev_password \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1
      - name: S3 adapter contract tests against real MinIO
        run: uv run pytest -m minio -v

  docs:
    name: Documentation links and commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate docs
        run: python3 scripts/check_docs.py

  security:
    name: Supply-chain scans, SBOM, and policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # Exceptions are checked FIRST: an expired accepted-risk entry is a
      # failure on its own, before any scan runs.
      - name: Validate vulnerability exceptions
        run: python3 scripts/supply_chain.py check-exceptions
      - name: Resolve Python dependency closure
        run: uv export --format requirements-txt --no-emit-project --no-emit-workspace > /tmp/requirements.txt
      # A scanner finding exits 1 and is evaluated by our policy. A scanner
      # crash exits >1 (or leaves invalid/missing JSON) and must fail here;
      # otherwise a broken scanner would be misreported as zero findings.
      - name: Run dependency scanners and validate reports
        shell: bash
        run: |
          set -u
          rm -f /tmp/pip-audit.json /tmp/pnpm-audit.json
          set +e
          uvx pip-audit -r /tmp/requirements.txt --format json --output /tmp/pip-audit.json
          pip_status=$?
          pnpm audit --json > /tmp/pnpm-audit.json
          pnpm_status=$?
          set -e
          if [ "$pip_status" -gt 1 ]; then
            echo "pip-audit crashed with status $pip_status" >&2
            exit "$pip_status"
          fi
          if [ "$pnpm_status" -gt 1 ]; then
            echo "pnpm audit crashed with status $pnpm_status" >&2
            exit "$pnpm_status"
          fi
          test -s /tmp/pip-audit.json
          test -s /tmp/pnpm-audit.json
          python3 -m json.tool /tmp/pip-audit.json >/dev/null
          python3 -m json.tool /tmp/pnpm-audit.json >/dev/null
      - name: Supply-chain policy gate
        run: |
          python3 scripts/supply_chain.py evaluate \
            --pip-audit /tmp/pip-audit.json --pnpm-audit /tmp/pnpm-audit.json
      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/requirements.txt \
            --output-format JSON --output-file sbom/python-sbom.cdx.json
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format JSON \
            --output-file sbom/web-sbom.cdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90
      # Container image scanning lives in its own `container-images` job
      # (build + Trivy per image), since REL-001 introduced the
      # Dockerfiles. See docs/SUPPLY_CHAIN_SECURITY.md.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-images:
    name: Container image build and scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: soa-api, dockerfile: apps/api/Dockerfile, target: api }
          - { name: soa-migrator, dockerfile: apps/api/Dockerfile, target: migrator }
          - { name: soa-worker, dockerfile: apps/worker/Dockerfile, target: runtime }
          - { name: soa-web, dockerfile: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build ${{ matrix.image.name }} image
        run: >-
          docker build --target ${{ matrix.image.target }}
          -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.name }}:ci .
      # Assert the runtime image is unprivileged: the default user must
      # not be root. (nginx-unprivileged and our `soa` user both satisfy
      # this; a regression to root fails here.)
      - name: Assert non-root runtime user
        run: |
          uid="$(docker run --rm --entrypoint sh ${{ matrix.image.name }}:ci -c 'id -u' 2>/dev/null \
            || docker run --rm ${{ matrix.image.name }}:ci id -u)"
          echo "runtime uid=$uid"
          test "$uid" != "0"
      - name: Scan ${{ matrix.image.name }} with Trivy
        # Every external action is pinned to an audited commit; the trailing
        # comment records the upstream release that commit represents.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ matrix.image.name }}:ci
          format: table
          severity: CRITICAL,HIGH
          # Unfixed OS-package CVEs cannot be remediated by us; the
          # dependency gate (soa_config.supply_chain) fails closed on app
          # deps we CAN pin. There are currently no container vulnerability
          # suppressions; see docs/SUPPLY_CHAIN_SECURITY.md.
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.12.2"
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform initialize without remote state
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
