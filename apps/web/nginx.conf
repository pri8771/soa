# Static serving config for the SOA web image (REL-001), served by the
# unprivileged nginx base on port 8080.
#
# The response headers mirror `securityHeaders` in apps/web/vite.config.ts
# (SEC-002) — that object is the source of truth exercised by the
# Playwright e2e suite; keep the two in sync. The static production host
# must serve this same set.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (SEC-002). `always` so they apply to error
    # responses too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self' https: http://localhost:8000 http://127.0.0.1:8000; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Liveness for an external HTTP probe (the image is intentionally
    # toolless, so there is no in-container HEALTHCHECK for web).
    location = /healthz {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to the app shell, never a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
