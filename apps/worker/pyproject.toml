[project]
name = "soa-worker"
version = "0.1.0"
description = "SOA asynchronous document-processing worker"
requires-python = ">=3.11"
dependencies = [
    "soa-config",
    "soa-db",
    "soa-storage",
    "soa-normalize",
    "soa-rules",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=4.30",
    "pillow>=11.0",
]

[project.scripts]
soa-worker = "soa_worker.main:main"

[tool.uv.sources]
soa-config = { workspace = true }
soa-db = { workspace = true }
soa-storage = { workspace = true }
soa-normalize = { workspace = true }
soa-rules = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_worker"]
