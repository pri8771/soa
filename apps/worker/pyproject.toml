[project]
name = "soa-worker"
version = "0.1.0"
description = "SOA asynchronous document-processing worker"
requires-python = ">=3.11"
dependencies = [
    "soa-config",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
soa-worker = "soa_worker.main:main"

[tool.uv.sources]
soa-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_worker"]
