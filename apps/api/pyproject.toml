[project]
name = "soa-api"
version = "0.1.0"
description = "SOA HTTP API and control plane"
requires-python = ">=3.11"
dependencies = [
    "soa-config",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "soa-fixtures",
    "soa-db",
    "soa-storage",
    "email-validator>=2.2",
]

[tool.uv.sources]
soa-config = { workspace = true }
soa-fixtures = { workspace = true }
soa-db = { workspace = true }
soa-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_api"]
