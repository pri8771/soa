[project]
name = "soa-db"
version = "0.1.0"
description = "Async SQLAlchemy engine/session management and migration support"
requires-python = ">=3.11"
dependencies = [
    "soa-config",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "openpyxl>=3.1",
]

[tool.uv.sources]
soa-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_db"]
