[project]
name = "soa-storage"
version = "0.1.0"
description = "Vendor-neutral object storage interface, contract tests, and adapters"
requires-python = ">=3.11"
dependencies = ["aiobotocore>=2.15", "soa-config"]

[tool.uv.sources]
soa-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_storage"]
