[project]
name = "soa-canonical"
version = "0.1.0"
description = "Versioned canonical sales-order schema and validation (CAN-001)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_canonical"]
