[project]
name = "soa-integrations"
version = "0.1.0"
description = "Shared outbound-integration safety policy and connection probes"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soa_integrations"]
